<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="320" height="140"
     fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <title>linear flowchart</title>
  <defs>
    <radialGradient id="vg" cx="50%" cy="52%" r="85%">
      <stop offset="0.60" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="0.46" y2="0.56">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="vignette" maskContentUnits="userSpaceOnUse">
      <rect width="320" height="140" fill="url(#vg)"/>
    </mask>
    <mask id="corner" maskContentUnits="userSpaceOnUse">
      <rect width="320" height="140" fill="url(#tl)"/>
    </mask>
    <marker id="ah" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="5.2" markerHeight="5.2"
            orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0.8 1.1 L9 5 L0.8 8.9" fill="none" stroke="#000" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g mask="url(#corner)"><g mask="url(#vignette)">
    <rect x="17" y="60" width="58" height="44" rx="12" stroke-width="2.6" opacity="1.0"/>
    <line x1="75" y1="82" x2="90" y2="82" stroke-width="2.3" opacity="1.0" marker-end="url(#ah)"/>
    <path d="M104 60 L150 60 L138 104 L92 104 Z" stroke-width="2.6" opacity="1.0"/>
    <line x1="150" y1="82" x2="165" y2="82" stroke-width="2.3" opacity="1.0" marker-end="url(#ah)"/>
    <rect x="167" y="60" width="66" height="44" rx="2" stroke-width="2.6" opacity="1.0"/>
    <line x1="233" y1="82" x2="248" y2="82" stroke-width="2.3" opacity="1.0" marker-end="url(#ah)"/>
    <rect x="250" y="60" width="58" height="44" rx="12" stroke-width="2.6" opacity="1.0"/>
  </g></g>
</svg>
